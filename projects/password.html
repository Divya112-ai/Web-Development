<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Password Toolkit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Poppins, sans-serif;
    }

    body {
      background-color: #18183b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 600px;
      background: #2c2a2a;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 20px;
      text-align: center;
    }

    h1 span {
      color: #cfcf6f;
      border-bottom: 3px solid #cfcf6f;
      padding-bottom: 5px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 15px 50px 15px 15px;
      font-size: 18px;
      border: 1px solid gray;
      border-radius: 6px;
      background: transparent;
      color: white;
    }

    ::placeholder {
      color: #ccc;
    }

    .icons {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 10px;
    }

    .icons img {
      width: 25px;
      cursor: pointer;
      opacity: 0.7;
    }

    .strength {
      font-size: 16px;
      margin-top: -10px;
      margin-bottom: 20px;
      color: white;
    }

    .strength.weak { color: red; }
    .strength.medium { color: orange; }
    .strength.strong { color: green; }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      background-color: #cfcf6f;
      color: #333;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e0e07a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><span>Smart</span> Password Toolkit</h1>

    <div class="input-group">
      <input type="password" id="password" placeholder="Your password here" />
      <div class="icons">
        <img src="eye.png" id="toggleEye" alt="Toggle visibility" />
        <img src="copy.png" id="copyBtn" alt="Copy password" />
      </div>
    </div>

    <p class="strength" id="strengthMsg">Password is <span id="strength"></span></p>

    <button onclick="generatePassword()">Generate Password</button>
  </div>

  <script>
    const passwordInput = document.getElementById("password");
    const toggleEye = document.getElementById("toggleEye");
    const copyBtn = document.getElementById("copyBtn");
    const strengthMsg = document.getElementById("strengthMsg");
    const strengthText = document.getElementById("strength");

    const length = 12;
    const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const lowercase = "abcdefghijklmnopqrstuvwxyz";
    const numbers = "0123456789";
    const symbols = "!@#$%^&*()_+{}[]:;<>,.?/|`~";
    const allChars = uppercase + lowercase + numbers + symbols;

    function generatePassword() {
      let password = "";
      password += uppercase[Math.floor(Math.random() * uppercase.length)];
      password += lowercase[Math.floor(Math.random() * lowercase.length)];
      password += numbers[Math.floor(Math.random() * numbers.length)];
      password += symbols[Math.floor(Math.random() * symbols.length)];

      while (password.length < length) {
        password += allChars[Math.floor(Math.random() * allChars.length)];
      }

      passwordInput.value = password;
      checkStrength(password);
    }

    function checkStrength(password) {
      strengthMsg.style.display = "block";
      if (password.length < 4) {
        strengthText.textContent = "weak";
        strengthMsg.className = "strength weak";
      } else if (password.length < 8) {
        strengthText.textContent = "medium";
        strengthMsg.className = "strength medium";
      } else {
        strengthText.textContent = "strong";
        strengthMsg.className = "strength strong";
      }
    }

    passwordInput.addEventListener("input", () => {
      checkStrength(passwordInput.value);
    });

    toggleEye.onclick = () => {
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggleEye.src = "close_eye.png";
      } else {
        passwordInput.type = "password";
        toggleEye.src = "eye.png";
      }
    };

    copyBtn.onclick = () => {
      navigator.clipboard.writeText(passwordInput.value);
      copyBtn.style.opacity = "1";
      setTimeout(() => copyBtn.style.opacity = "0.7", 1000);
    };
  </script>
</body>
</html>
