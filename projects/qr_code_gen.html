<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: poppins;
            box-sizing: border-box;
        }
        body{
            background-color: rgb(25, 36, 30);
        }
       .container{
        width: 400px;
        padding: 25px 35px;
        position: absolute;
        transform: translate(-50%,-50%);
        background-color: rgb(228, 190, 228);
        top: 50%;
        
        left: 50%;
        border-radius: 5px;       
       }
       .container p{
        font-weight: 900;
        font-size: 25px;
        color: rgb(37, 35, 35);
        font-family:Verdana, Geneva, Tahoma, sans-serif;

        margin-bottom: 8px;
       }
       .container input{
        width: 100%;
        height: 50px;
        border: 1px;
        outline: 0;
        padding: 10px;
        margin: 10px 0 20px;
        border-radius: 5px;
        box-shadow: 0 10px 10px rgb(211, 190, 190);
        font-size: large;
       }
       .container button{
        padding: 10px;
        width: 100%;
        border-radius: 5px;
        border: 0;
        font-size: larger;
        background-color: rgb(238, 223, 206) ;
        font-weight: 900;
        color:rgb(60, 58, 58);
        box-shadow: 0 10px 10px rgb(99, 96, 96);
        cursor: pointer;    
       }
       #imgbox{
        width: 200px;
        border-radius:5px ;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.5s ease-in;
        margin-bottom: 10px;
       }
       #imgbox img{
        width: 100%;
        padding: 10px;
       }
       #imgbox.show-img{
        max-height: 300px;
        margin : 10px auto;
        border : 3px solid black ;
    }
    .error{
        animation: shake 0.1 linear 10;

    }
    @keyframes shake{
        0%{transform :translateX(0);}
        20%{transform :translateX(-2px);}
        50%{transform :translateX(0);}
        75%{transform :translateX(2px);}
        100%{transform: translateX(0);}
        
    }    </style>
</head>
<body>
        <div class="container">
            <p>enter your text or url</p>
            <input type="text" placeholder="text or url" id="qrinput">
            <div id="imgbox">
                <img src="" id="qrimg">
            </div>
            <button onclick="generateQR()">generate QRcode</button>
        </div>
        <script>
            let imgbox=document.getElementById("imgbox");
            let qrimg=document.getElementById("qrimg")
            let qrtext=document.getElementById("qrinput")
            function generateQR(){
                if(qrtext.value.length>0){
                qrimg.src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data="+qrtext.value;
                imgbox.classList.add("show-img");
            }
        else{
            alert("enter some text or url")
            qrtext.classList.add("error")
            setTimeout(()=>{
                qrtext.classList.remove("error")
            },1000);
        }}
        </script>
</body>
</html>
