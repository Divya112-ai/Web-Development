<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            font-family: poppins;
            box-sizing: border-box;
            margin: 0;
        }
        body{
            background-color: rgb(24, 24, 55);
            color: white;
        }
        .container{

            margin: 12%;
            width: 90%;
            max-width: 700px;
        }
        .display{
            width:100%;
            margin-top: 50px;
            margin-bottom: 30px;
            background-color:rgb(143, 137, 137) ;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 26px 20px;
            border-radius: 5px;

        }
        .container h1{
            font-weight: 500;
            font-size: 45px;
            line-height: 1.2;

        }
        .container h1 span{
            color : rgb(149, 149, 76);
            border-bottom: 4px solid  rgb(149, 149, 76);
            padding-bottom: 7px;
        }
        .display img{
            cursor: pointer;
        }
        .display input{
            border: 0;
            outline: 0;
            font-size: 24px;

        }

        button{
            padding: 10px;
            outline: 0;
            background-color: rgb(149, 149, 76);
            color: white;
            font-size: 22px;
            font-weight: 400;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            border-radius: 6px;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1> Generate a <br> <span>Random Password</span> </divh1>
            <div class="display">
                <input type="text" id="password" placeholder="Password">
                <img src="copy.png" width="50px" onclick="copypass()">
            </div>
            <button onclick="createpassword()">Generate Password</button>
        </div>
        <script>
            const Passwordbox =document.getElementById("password")
            const length=12;
            const btn=document.querySelector("button")
            const uppercase="ABCDEFGHIJKMLNOPQRSTUVWQYZ"
            const lowercase="abcdefghijklmanopqrtuvwxyz"
            const number="1234567890"
            const symbols="!@#$%^&*()_+{[]}:;'<>,.?/|`~";
            let allchars=uppercase+lowercase+number+symbols;    


function createpassword() {
    let password = "";
    password += uppercase[Math.floor(Math.random() * uppercase.length)];
    password += lowercase[Math.floor(Math.random() * lowercase.length)];
    password += number[Math.floor(Math.random() * number.length)];
    password += symbols[Math.floor(Math.random() * symbols.length)];

    while (password.length < length) {
        password += allchars[Math.floor(Math.random() * allchars.length)];
    }

    Passwordbox.value = password;
}

function copypass() {
    Passwordbox.select();
    document.execCommand("copy");
}
            
        </script>
</body>
</html>
