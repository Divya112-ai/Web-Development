<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{ margin: 0px;
        padding:0;
        font-family:poppins;
        box-sizing: border-box;
       }
       .container{
        width: 100%;
        min-height: 100vh;
        background-color: rgb(14, 11, 75);
        display:flex;
        justify-content: center;
        align-items: center;
        
    }
    #lift, #right{
        width: 300px;
        min-height: 400px;
        border: 2px dashed rgb(255, 255, 255);
        border-radius: 10px;
        display: flex;
        
        flex-direction: column;
        justify-content:center;
        color: rgb(255, 255, 255);
        font-size: 25px;
        font-weight: 900;
        margin: 10px;
       }
       .lift:hover, .right:hover{
        background-color: rgb(255, 255, 255);
        color: rgb(0, 0, 0);
        border: 2px dashed rgb(0, 0, 0);
        cursor: pointer;
       }
       .list{
        background-color: rgb(238, 72, 191);
        display: flex;
        margin: 15px;
        /* align-items:center; */
        /* justify-content: center; */
        color: rgb(255, 255, 255);
        cursor: grab;
        flex-direction:column;
        padding: 10px;
        border-radius: 5px;
       }
       
    
    </style>
</head>
<body>
    <div class="container">
        <div id="lift"><div class="list" draggable="true"><img src="w_icon.png" width="20px"> list item   </div> 
        <div class="list" draggable="true"><img src="w_icon.png" width="20px"> list item   </div> 
        <div class="list" draggable="true"><img src="w_icon.png" width="20px"> list item   </div> 
        <div class="list" draggable="true"><img src="w_icon.png" width="20px"> list item   </div> 
    </div>
        <div id="right">   </div>
    </div>
    
    <script>
        let lists=document.getElementsByClassName("list")
        let rightbox=document.getElementById("right");  
        let leftbox=document.getElementById("lift");  
        for(let list of lists){
            list.addEventListener("dragstart",function(e){
                let selected=e.target;
                rightbox.addEventListener("dragover",function(e){
                    e.preventDefault();
                })
                rightbox.addEventListener("drop", function(e){
                    rightbox.appendChild(selected);
                    selected=null;

                })
                leftbox.addEventListener("dragover",function(e){
                    e.preventDefault();
                })
                leftbox.addEventListener("drop", function(e){
                    leftbox.appendChild(selected);
                    selected=null;
                    
                })
            })
        }
   </script>
</body>
</html>
