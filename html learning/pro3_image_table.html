<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image</title>
    <link rel="stylesheet" href=pro3_image_table.css>
</head>
<body>
    <!-- image contant-->
    <img width="230" height="285" src="img1.jpg" >
    <img width="230" height="285" src="img3.jpg" >
  <!--alt is used as default if there is no img named img2-->
    <img src="img2" alt="flower image">

    <!-- table content-->
     <table>
        <caption>flowers</caption>
        <br>
        <head>details about flowers</head>
        <tr>
            <th>name</th>
            <th>color</th>
            <th>features</th>
            <th></th>
        </tr>
        <tr>
            <th>roses</th>
            <th>red</th>
            <th>Fragrant</th>
        </tr>
        <tr>
            
        </tr>
        <tr>
            <th>lotus</th>
            <th>pink</th>
            <th>round blooms</th>
            
        </tr>
     </table>
     <!--table example to represent the colspan rowspan-->
     <table>
        <caption>new table</caption>
        <tr>
            <th>name</th>
            <th>color</th>
            <th>features</th>
            <th></th>
        </tr>
        <tr>

        </tr>
        <tr>
            <th>roses</th>
            <th>red</th>
            <th rowspan="2">Fragrant</th>
        </tr>
        <tr>
            <th colspan="2">lotus</th>
        </tr>
     
     </table>
</body>
</html>
