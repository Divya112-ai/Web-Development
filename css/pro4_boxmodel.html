<!-- css box model : defines how elements are rendered and how their dimensions are calculated -->
 <!-- it describes the structure of an elements as a rectangular box that has content,padding ,border,margine -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css boxmodel</title>
    <style>
        *{
            margin: 0;
            padding: 0%;
        }
        .box{
            background-color: yellow;
        }
        .box1{
            color: red;
             padding: 10px;
            margin: 5px;
            border: 3px solid blue;
            height: 200px;
            /* when we write only height , it does not include margine and padding */
            /* but when we specify boxsizing : it includes padding and border and adjust heihgt */
            box-sizing: border-box;
        
        }
        .box2{
            color: blue;
            padding: 10px;
            margin: 5px;
            border: 3px solid blue;
            height: 200px;
            /* when we write only height , it does not include margine and padding */
            /* but when we specify boxsizing : it includes padding and border and adjust heihgt */
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box box1">
        hey im box 1
    </div>
    <div class="box box2">
        hey im box2
    </div>
</body>
</html>
<!-- margine colabs : when there are two margines are overlapping , it takes larger margine by it self -->
