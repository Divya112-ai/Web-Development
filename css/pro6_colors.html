<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colors</title>
    <style>
        h1{
            color: red;
        }
        h2{
            color: #E46A8E;
        }
        .rgb{
            color: rgb(24, 555, 63);
        }
        .rgba{
            color: rgba(23, 100, 200, 0.847);
        }
        .hsl{
            color: hsl(100, 400%, 30%);
        }
    </style>
</head>
<body>
    <h1>this is me COLOR KEYWORD</h1>
    <H2>this is me hex color</H2>
    <h2 class="rgba">this is me rgba</h2>
    <h2 class="rgb">this is me rgb</h2>
    <h2 class="hsl">this is me hsl</h2>
    <p>
        color can be represented
        <ol>
            <li>color keywords</li>
            <li>hext color</li>
            <li>RGB</li>
            <li>RGBA</li>
            <li>HSL</li>
        </ol>
    </p>
</body>
</html>
