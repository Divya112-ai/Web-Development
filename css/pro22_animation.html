<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
    <style>
        .cont{
            background-color: bisque;
            width: 80vw;
            height: 80vh;
        }
        .box{
            /* background-color: rgb(226, 94, 116); */
            width: 34px;
            height: 56px;
            animation: animation;
            animation-duration: 2s;
            animation-iteration-count: 2;
            /* animation-iteration-count: infinite; */
            /* animation-timing-function: ease-in-out; */
            /* animation-timing-function:cubic-bezier(0.87, -0.67, 1, 1) ; */
           animation-timing-function: cubic-bezier(0.42, -0.32, 1, 0.28);
            animation-delay: 1s;
            /* animation-direction: reverse; */
            animation-direction: alternate-reverse;
            /* animation-play-state:paused ; */
            animation-fill-mode: none ;
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
        }
        /* where animation is variable it can be any named */
        .box2{
            background-color: aqua;
            width: 50px;
            height: 50px;
            animation: animation2;
            animation-duration: 2s;
            animation-iteration-count: 3;
        }
        @keyframes animation{

            from{
                background-color: red;
            }
            to{
                transform:translatex(1000px);
                background-color: rgb(193, 165, 218);
            }
        }
        @keyframes animation2{
            0%{
                transform: rotate(100deg);
            }
            20%{
                transform: rotate(200deg);
            }
            50%{
                transform: rotate(220deg);
            }
            80%{
                transform: rotate(30deg);
            }
            100%{
                transform: rotate(310deg);
            }
        }
    </style>
</head>
<body>
    <div class="cont">
        <div class="box">

        </div>
        <div class="box2"></div>
    </div>
</body>
</html>
