<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css</title>
    <style>
        div , span{
            color: blueviolet;
            background: antiquewhite;
        }
        p{
            color: blue;
            background-color: rgb(222, 205, 185);
        }
        /* div : selector ,,color : value ,, red : property both between{} declaration */
    </style>
</head>
<body>
    <div>css mode is starting</div>
    <span>welcome</span>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Placeat provident animi, labore at, voluptates mollitia debitis nemo nam ipsam itaque sunt vel eos praesentium, non unde sit qui adipisci voluptas?</p>

</body>
</html>
