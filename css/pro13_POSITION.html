<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position property</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        .box1{
            background-color: aquamarine;
            /* position: absolute; */
            /* position: sticky; */
            top: 0px;
            position: relative;
            z-index: 1;
            
        }
        
        .box2{
            background-color: rgb(17, 231, 160);
            /* position: relative; */
            bottom: 100px;
            left:50px;

        }
        
        .box3{
            background-color: rgb(47, 157, 121);

        }
        
        .box4{
            background-color: rgb(29, 117, 87);
            /* position: fixed; */
        }
        .box{
            height: 123px;
            width: 50vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }
        .parent{
            padding: 43px;
            margin: 34px;
            border: solid black 2px;
            position: absolute;
        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    </div>
</body>
</html>

 <!-- position relative : we can add top borrom left property , only on it-->
  <!-- position absolute , its top , left properties are applied to relative to html -->
   <!-- its applied nearest positient one , when no one is positive its applied related to html -->
    <!-- but when there is position is applied to its parent div , top left applied relative to it -->
