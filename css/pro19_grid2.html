<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .container{
            border:  2px solid rgb(6, 6, 5);
            display: grid;
            grid-template-areas: "nav nav nav" "side article article" "footer footer footer";
            height: 100vh;
        }
        .item{
            border : 2px solid red;
            /* height: 90px; */
            /* width: 90px; */
        }
        .item1{
            grid-area: nav;
            background-color: aqua;
        }
        .item2{
            grid-area: side;
            background-color: blueviolet;
        }
        .item3 {
            grid-area: article;
        }
        .item4{
             grid-area: footer;
        }
        .item5{
            grid-area: nav;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">1</div>
        <div class="item item2">2</div>
        <div class="item item3">3</div>
        <div class="item item4">4</div>
        <div class="item5 item">5</div>
    </div>
</body>
</html>
