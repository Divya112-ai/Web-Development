<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border:  2px solid rgb(6, 6, 5);
            display: grid;
            /* grid-template-columns:[pehla] 120px[doosra] 100px; */
            /* grid-template-rows: 100px 100px 100px; */
            grid-template-columns: 1fr 1fr 1fr;
            /* 3 factors  , */
            gap: 34px;
            row-gap:34px ;
            height: 100vh;
            align-items: center;
        }
        .item{
            border : 2px solid red;
            height: 90px;
            width: 90px;
        }
        .item4{
            grid-row: 1/2;
            /* grid-column: 1/2; */
            /* grid-row-start: 1 ; */
            /* grid-row-end: 2; */
            /* grid-column: pehla /dusra; */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item4">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item4 item">5</div>
    </div>
</body>
</html>
