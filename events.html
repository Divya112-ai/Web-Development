<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <button type="button" id="btn">click me..!</button>
        <script>
            let btn=document.getElementById("btn")
            btn.addEventListener("click",()=>{
                // alert("yeyy")
                document.querySelector(".container").innerHTML="yayy , you are clicked...."
            })
            btn.addEventListener("dblclick",()=>{
                // alert("yeyy")
                document.querySelector(".container").innerHTML="yayy...."
            })
        </script>
    </div>
</body>
</html>
